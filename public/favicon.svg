<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="nibGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DC2626" />
      <stop offset="100%" stop-color="#991B1B" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>

  <!-- Background Circle -->
  <circle cx="256" cy="256" r="240" fill="#FFFFFF" stroke="#DC2626" stroke-width="12" />

  <!-- Outer Ring Accent -->
  <circle cx="256" cy="256" r="216" fill="none" stroke="#F59E0B" stroke-width="4" stroke-dasharray="12 8" opacity="0.6" />

  <!-- Fountain Pen Nib -->
  <g transform="translate(0, -10)">
    <!-- Main Nib Body -->
    <path d="M256 70 L340 240 C340 330 320 370 310 390 L202 390 C192 370 172 330 172 240 Z" fill="url(#nibGrad)" stroke="url(#goldGrad)" stroke-width="8" />

    <!-- Gold Wings & Inlays -->
    <path d="M256 70 L340 240 L310 240 L256 120 L202 240 L172 240 Z" fill="url(#goldGrad)" opacity="0.4" />

    <!-- Breathing Hole (Heart/Circle Accent) -->
    <circle cx="256" cy="260" r="22" fill="#FFFFFF" stroke="url(#goldGrad)" stroke-width="6" />

    <!-- Slit Line -->
    <line x1="256" y1="70" x2="256" y2="238" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round" />

    <!-- Base Collar -->
    <rect x="190" y="390" width="132" height="30" rx="6" fill="#0F172A" stroke="url(#goldGrad)" stroke-width="6" />
    <rect x="180" y="420" width="152" height="16" rx="4" fill="url(#goldGrad)" />

    <!-- Ink Drop -->
    <path d="M256 448 C256 448 274 472 274 484 C274 494 266 502 256 502 C246 502 238 494 238 484 C238 472 256 448 256 448 Z" fill="#DC2626" />
  </g>
</svg>
